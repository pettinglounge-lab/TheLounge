<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — Petting Lounge</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <site-nav></site-nav>

  <main id="root">
    <!-- filled by script -->
  </main>

  <script type="module">
    import { supabase } from "./supabaseClient.js";

    const PRICES = {
      '11" x 14"': 79, '12" x 16"': 89, '16" x 16"': 99, '16" x 20"': 109,
      '16" x 24"': 129, '20" x 30"': 149, '12" x 36"': 159,
    };

    const root = document.getElementById("root");

    // Read what the pet page stashed in the browser.
    let order = null, photoDataUrl = null, presetPreview = null;
    try {
      order = JSON.parse(sessionStorage.getItem("ptl_order"));
      photoDataUrl = sessionStorage.getItem("ptl_photo");
      presetPreview = sessionStorage.getItem("ptl_preview");
    } catch (e) { /* ignore */ }

    if (!order || !photoDataUrl) {
      root.innerHTML = `
        <div class="checkout-empty">
          <h1>Nothing to check out yet</h1>
          <p style="color:var(--ink-soft); margin:10px 0 18px;">Start by choosing a portrait.</p>
          <a href="pet.html">Browse pet portraits →</a>
        </div>`;
    } else {
      renderCheckout();
    }

    function renderCheckout() {
      const price = PRICES[order.size] ?? 99;
      root.innerHTML = `
        <div class="checkout">
          <div class="preview-panel" id="preview">
            <div class="preview-loading">
              <div class="spinner"></div>
              Creating your portrait preview…<br />this takes a few seconds.
            </div>
          </div>

          <div class="summary">
            <h1>Custom Dog Portrait</h1>
            <p class="sub">Framed canvas · printed &amp; shipped</p>

            <div class="row"><span class="label">Canvas size</span><span class="value">${order.size}</span></div>
            <div class="row"><span class="label">Pet's name</span><span class="value">${order.petName ? escapeHtml(order.petName) : "—"}</span></div>
            <div class="row"><span class="label">Shipping</span><span class="value">Free</span></div>
            <div class="row total"><span>Total</span><span>$${price}</span></div>

            <button class="btn btn-primary" id="pay" disabled>Proceed to payment</button>
            <div class="stub">Payment isn't connected yet — this is where Stripe checkout will go.</div>
            <p class="secure">You'll be able to review everything before paying.</p>
          </div>
        </div>`;

      document.getElementById("pay").addEventListener("click", () => {
        alert("Payment coming soon — this is where Stripe will take over, then we submit to Printify.");
      });

      generatePreview(price);
    }

    // Show the preview generated in the popup. Only regenerate if we somehow
    // arrived here without one.
    async function generatePreview(price) {
      const panel = document.getElementById("preview");

      if (presetPreview) {
        panel.innerHTML = `<img src="${presetPreview}" alt="Your portrait preview" />`;
        document.getElementById("pay").disabled = false;
        return;
      }

      try {
        const blob = dataURLtoBlob(photoDataUrl);
        const fd = new FormData();
        fd.append("image", blob, "photo.jpg");
        fd.append("note", order.petName ? `add the name ${order.petName}` : "");

        const { data, error } = await supabase.functions.invoke("preview-portrait", { body: fd });
        if (error) throw error;

        panel.innerHTML = `<img src="${data.previewUrl}" alt="Your portrait preview" />`;
        document.getElementById("pay").disabled = false;
      } catch (e) {
        panel.innerHTML = `
          <div class="preview-loading">
            Couldn't create the preview right now.<br />
            <span style="font-size:12px;">${escapeHtml(String(e.message || e))}</span>
          </div>`;
      }
    }

    function dataURLtoBlob(dataUrl) {
      const [head, b64] = dataUrl.split(",");
      const mime = head.match(/:(.*?);/)[1];
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return new Blob([arr], { type: mime });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    }
  </script>

  <script type="module" src="Navbar.js"></script>
</body>
</html>
