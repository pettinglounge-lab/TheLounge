<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — Petting Lounge</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=checkout-shipping-v1" />
</head>
<body>

  <site-nav></site-nav>

  <main id="root">
    <!-- filled by script -->
  </main>

  <script type="module">
    import { supabase } from "./supabaseClient.js";
    import { saveOrderDraft, quoteOrderShipping, openOrderPayment } from "./order-draft.js";

    const root = document.getElementById("root");

    // Read what the pet page stashed in the browser.
    let order = null, photoDataUrl = null, presetPreview = null;
    let product = null, variants = [], selectedVariant = null;
    let shippingQuote = null;
    try {
      order = JSON.parse(sessionStorage.getItem("ptl_order"));
      photoDataUrl = sessionStorage.getItem("ptl_photo");
      presetPreview = sessionStorage.getItem("ptl_preview");
    } catch (e) { /* ignore */ }

    const paymentReturn = new URLSearchParams(location.search);
    if (paymentReturn.get("payment") === "success") {
      root.innerHTML = `<div class="checkout-empty"><h1>Confirming your payment</h1><p id="payment-status" role="status">Checking your order…</p><a href="account.html">View your account →</a></div>`;
      confirmPayment(paymentReturn.get("draft_id"));
    } else if (!order || !presetPreview) {
      root.innerHTML = `
        <div class="checkout-empty">
          <h1>Nothing to check out yet</h1>
          <p style="color:var(--ink-soft); margin:10px 0 18px;">Start by choosing a portrait.</p>
          <a href="pet.html">Browse pet portraits →</a>
        </div>`;
    } else {
      renderCheckout();
    }

    async function confirmPayment(draftId) {
      const message = document.getElementById("payment-status");
      if (!/^[0-9a-f-]{36}$/i.test(draftId || "")) {
        message.textContent = "Check your account for the payment status.";
        return;
      }
      for (let attempt = 0; attempt < 10; attempt++) {
        const { data, error } = await supabase.from("orders").select("id,status").eq("draft_id", draftId).maybeSingle();
        if (data) {
          message.textContent = "Payment received. Your order has been saved.";
          sessionStorage.removeItem("ptl_order_draft_attempt");
          return;
        }
        if (error) break;
        await new Promise(resolve => setTimeout(resolve, 2000));
      }
      message.textContent = "Payment confirmation is still pending. Check your account shortly; please do not pay again.";
    }

    function renderCheckout() {
      root.innerHTML = `
        <div class="checkout">
          <div class="preview-panel" id="preview">
            <div class="preview-loading">
              <div class="spinner"></div>
              Loading your portrait…
            </div>
          </div>

          <div class="summary">
            <h1>${escapeHtml(order.title || "Custom Pet Portrait")}</h1>
            <p class="sub">Choose your product options.</p>
            <div id="options"><div class="preview-loading"><div class="spinner"></div>Loading options…</div></div>
            <form id="shipping-form" class="shipping-form">
              <fieldset id="shipping-fields">
                <legend>Shipping address</legend>
                <div class="shipping-grid">
                  <label>First name<input name="first_name" autocomplete="shipping given-name" required maxlength="100" /></label>
                  <label>Last name<input name="last_name" autocomplete="shipping family-name" required maxlength="100" /></label>
                  <label class="shipping-wide">Email<input name="email" type="email" autocomplete="shipping email" required maxlength="254" /></label>
                  <label class="shipping-wide">Phone (optional)<input name="phone" type="tel" autocomplete="shipping tel" maxlength="40" /></label>
                  <label class="shipping-wide">Country<select name="country" autocomplete="shipping country" required><option value="">Select country</option></select></label>
                  <label class="shipping-wide">Street address<input name="address1" autocomplete="shipping address-line1" required maxlength="200" /></label>
                  <label class="shipping-wide">Apartment, suite, etc. (optional)<input name="address2" autocomplete="shipping address-line2" maxlength="200" /></label>
                  <label>City<input name="city" autocomplete="shipping address-level2" required maxlength="100" /></label>
                  <label>State / province / region<input name="region" autocomplete="shipping address-level1" maxlength="100" /></label>
                  <label>Postal / ZIP code<input name="zip" autocomplete="shipping postal-code" maxlength="20" /></label>
                </div>
                <p class="shipping-help">Enter state and postal code where applicable. Shipping availability and cost will be confirmed before payment.</p>
              </fieldset>
              <button class="btn btn-primary" id="pay" type="submit" disabled>Calculate shipping</button>
            </form>
            <p class="msg" id="order-save-message" role="status"></p>
            <p class="secure">Calculate standard shipping for your artwork. Payment is completed securely with Stripe.</p>
          </div>
        </div>`;

      const shippingForm = document.getElementById("shipping-form");
      // ISO country codes are inputs, not a promise of provider availability.
      const countryCodes = "AD AE AF AG AI AL AM AO AQ AR AS AT AU AW AX AZ BA BB BD BE BF BG BH BI BJ BL BM BN BO BQ BR BS BT BV BW BY BZ CA CC CD CF CG CH CI CK CL CM CN CO CR CU CV CW CX CY CZ DE DJ DK DM DO DZ EC EE EG EH ER ES ET FI FJ FK FM FO FR GA GB GD GE GF GG GH GI GL GM GN GP GQ GR GS GT GU GW GY HK HM HN HR HT HU ID IE IL IM IN IO IQ IR IS IT JE JM JO JP KE KG KH KI KM KN KP KR KW KY KZ LA LB LC LI LK LR LS LT LU LV LY MA MC MD ME MF MG MH MK ML MM MN MO MP MQ MR MS MT MU MV MW MX MY MZ NA NC NE NF NG NI NL NO NP NR NU NZ OM PA PE PF PG PH PK PL PM PN PR PS PT PW PY QA RE RO RS RU RW SA SB SC SD SE SG SH SI SJ SK SL SM SN SO SR SS ST SV SX SY SZ TC TD TF TG TH TJ TK TL TM TN TO TR TT TV TW TZ UA UG UM US UY UZ VA VC VE VG VI VN VU WF WS YE YT ZA ZM ZW".split(" ");
      const countryNames = typeof Intl.DisplayNames === "function" ? new Intl.DisplayNames(["en"], { type: "region" }) : null;
      const countries = countryCodes.map(code => ({ code, name: countryNames?.of(code) || code }))
        .sort((a, b) => a.name.localeCompare(b.name));
      const countrySelect = shippingForm.elements.namedItem("country");
      countries.forEach(({ code, name }) => countrySelect.add(new Option(name, code)));
      try {
        const previous = JSON.parse(sessionStorage.getItem("ptl_shipping_address"));
        for (const field of shippingForm.querySelectorAll("input, select")) {
          if (typeof previous?.[field.name] === "string") field.value = previous[field.name];
        }
      } catch { /* Address entry still works when browser storage is unavailable. */ }
      shippingForm.addEventListener("input", event => {
        event.target.setCustomValidity?.("");
        shippingQuote = null;
        document.getElementById("pay").textContent = "Calculate shipping";
        document.getElementById("order-save-message").textContent = "";
      });
      shippingForm.addEventListener("submit", async event => {
        event.preventDefault();
        for (const field of shippingForm.querySelectorAll("input")) {
          field.value = field.value.trim();
        }
        if (!shippingForm.reportValidity() || !selectedVariant) return;
        const shipping = Object.fromEntries(new FormData(shippingForm));
        const button = document.getElementById("pay");
        const message = document.getElementById("order-save-message");
        button.disabled = true;
        button.textContent = shippingQuote ? "Opening payment…" : "Calculating…";
        document.getElementById("shipping-fields").disabled = true;
        document.querySelectorAll("#options select").forEach(select => { select.disabled = true; });
        message.textContent = "";
        try {
          // Retain address entry for retries in this tab.
          sessionStorage.setItem("ptl_shipping_address", JSON.stringify(shipping));
          if (shippingQuote) {
            await openOrderPayment(shippingQuote.orderId, shipping, shippingQuote.shippingCents);
            return;
          }
          const saved = await saveOrderDraft(order, presetPreview);
          const quote = await quoteOrderShipping(saved.orderId, shipping);
          shippingQuote = quote;
          const money = cents => new Intl.NumberFormat("en-US", { style: "currency", currency: quote.currency }).format(cents / 100);
          document.getElementById("total").textContent = money(quote.subtotalCents);
          message.textContent = `Standard shipping: ${money(quote.shippingCents)}. Total before tax: ${money(quote.totalBeforeTaxCents)}. Tax will be calculated at payment.`;
        } catch (error) {
          if (["quote_changed", "new_draft_required"].includes(error.code)) shippingQuote = null;
          message.textContent = error.message || "Unable to calculate shipping. Please retry.";
        } finally {
          button.disabled = false;
          button.textContent = shippingQuote ? "Continue to payment" : "Calculate shipping";
          document.getElementById("shipping-fields").disabled = false;
          document.querySelectorAll("#options select").forEach(select => { select.disabled = false; });
        }
      });

      showPreview();
      loadOptions();
    }

    async function loadOptions() {
      const box = document.getElementById("options");
      let { data, error } = await supabase.from("products")
        .select("product_type, variants, available")
        .eq("printify_product_id", order.printify_product_id)
        .eq("category", order.category)
        .maybeSingle();
      // Home and Memory temporarily use the Pet catalog before their own
      // category rows have been synced. Prefer their category whenever present.
      if (!error && !data && order.category !== "pet") {
        ({ data, error } = await supabase.from("products")
          .select("product_type, variants, available")
          .eq("printify_product_id", order.printify_product_id)
          .eq("category", "pet")
          .maybeSingle());
      }
      if (error || !data?.available || !Array.isArray(data.variants) || !data.variants.length) {
        box.innerHTML = `<div class="checkout-note">Product options are unavailable right now. Please return and choose another product.</div>`;
        return;
      }
      product = data;
      variants = data.variants.map(v => {
        const parts = String(v.size || "").split(" / ").map(s => s.trim());
        return { id: v.id, price: Number(v.price), size: parts[0] || "Standard", detail: parts.slice(1).join(" / "), color: parts.find(p => ["Natural", "White", "Espresso", "Black"].includes(p)) || "" };
      });
      const colors = [...new Set(variants.map(v => v.color).filter(Boolean))];
      box.innerHTML = `
        ${colors.length ? `<label class="field-label" for="color">Frame color</label><select class="select" id="color">${colors.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("")}</select>` : ""}
        <label class="field-label" for="variant">${colors.length ? "Size" : "Product option"}</label><select class="select" id="variant"></select>
        <label class="field-label" for="quantity">Quantity</label><select class="select" id="quantity">${[1,2,3,4,5].map(n => `<option value="${n}">${n}</option>`).join("")}</select>
        <div class="row total"><span>Product subtotal</span><span id="total">—</span></div>`;
      document.getElementById("color")?.addEventListener("change", () => { populateVariants(); showPreview(); });
      document.getElementById("variant").addEventListener("change", chooseVariant);
      document.getElementById("quantity").addEventListener("change", chooseVariant);
      populateVariants();
      showPreview();
      document.getElementById("pay").disabled = false;
    }

    function populateVariants() {
      const color = document.getElementById("color")?.value;
      const matches = color ? variants.filter(v => v.color === color) : variants;
      document.getElementById("variant").innerHTML = matches.map(v => `<option value="${escapeHtml(v.id)}">${escapeHtml(v.size)}${v.detail ? ` · ${escapeHtml(v.detail)}` : ""} · $${v.price.toFixed(2)}</option>`).join("");
      chooseVariant();
    }

    function chooseVariant() {
      shippingQuote = null;
      document.getElementById("pay").textContent = "Calculate shipping";
      document.getElementById("order-save-message").textContent = "";
      selectedVariant = variants.find(v => String(v.id) === document.getElementById("variant").value);
      const quantity = Number(document.getElementById("quantity").value);
      if (!selectedVariant) return;
      document.getElementById("total").textContent = `$${(selectedVariant.price * quantity).toFixed(2)}`;
      Object.assign(order, { variantId: selectedVariant.id, size: selectedVariant.size, frameColor: selectedVariant.color || null, price: selectedVariant.price, quantity });
      sessionStorage.setItem("ptl_order", JSON.stringify(order));
    }

    // Show the preview generated in the popup (carried over — never regenerated here).
    async function showPreview() {
      const panel = document.getElementById("preview");
      if (presetPreview) {
        const color = document.getElementById("color")?.value?.toLowerCase() || "black";
        const type = product?.product_type || order.product_type;
        const config = type === "framed-poster"
          ? { file: `frame${color}.png`, opening: "top:11%;left:20%;width:60%;height:78%;" }
          : type === "greeting-card"
            ? { file: "card.png", opening: "top:15%;left:26%;width:48%;height:70%;" }
            : { file: "poster.png", opening: "top:17%;left:30%;width:40%;height:68%;" };
        panel.innerHTML = `<div class="mockup-stage checkout-mockup"><img class="mockup-base" src="assets/t/${config.file}" alt="Product mockup" /><img class="mockup-art" style="${config.opening}display:block;" src="${escapeHtml(presetPreview)}" alt="Your generated portrait" /></div>`;
        return;
      }
      panel.innerHTML = `<div class="preview-loading">No preview found — please start again from the product page.</div>`;
    }

    function dataURLtoBlob(dataUrl) {
      const [head, b64] = dataUrl.split(",");
      const mime = head.match(/:(.*?);/)[1];
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return new Blob([arr], { type: mime });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    }
  </script>

  <script type="module" src="Navbar.js"></script>

    <div class="container">
      <a class="brand" href="index.html" aria-label="Petting Lounge home">Petting Lounge</a>
      <nav>
        <a href="pet.html">Pets</a>
        <a href="home.html">Home</a>
        <a href="memories.html">Memories</a>
        <a href="custom.html">My Projects</a>
        <a href="terms.html">Terms</a>
      </nav>
      <span class="muted">© 2026 Petting Lounge</span>
    </div>
  </footer>

</body>
</html>
