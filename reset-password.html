<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — Petting Lounge</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <site-nav></site-nav>

  <main class="auth-wrap">
    <div class="auth-card">
      <h1>Set a new password</h1>
      <p class="sub">Choose a new password for your account.</p>

      <form id="reset-form">
        <label for="password">New password</label>
        <input type="password" id="password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password" />

        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" placeholder="Re-enter password" required minlength="6" autocomplete="new-password" />

        <button type="submit" class="btn btn-primary" id="submit-btn" style="width:100%; text-align:center;">Update password</button>
      </form>

      <p class="msg" id="message"></p>
    </div>
  </main>

  <script type="module">
    import { supabase } from "./supabaseClient.js";

    const form    = document.getElementById("reset-form");
    const passIn  = document.getElementById("password");
    const confIn  = document.getElementById("confirm");
    const btn     = document.getElementById("submit-btn");
    const message = document.getElementById("message");

    // When the user arrives from the email link, Supabase reads the recovery
    // token from the URL and creates a temporary session automatically. If
    // there's no session (link expired or opened directly), we tell them.
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      form.style.display = "none";
      message.textContent = "This reset link is invalid or has expired. Request a new one from your account.";
      message.className = "msg err";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const pass = passIn.value, conf = confIn.value;
      message.textContent = ""; message.className = "msg";

      if (pass !== conf) {
        message.textContent = "Passwords don't match.";
        message.className = "msg err";
        return;
      }

      btn.disabled = true; btn.textContent = "Updating…";
      const { error } = await supabase.auth.updateUser({ password: pass });

      if (error) {
        message.textContent = error.message;
        message.className = "msg err";
        btn.disabled = false; btn.textContent = "Update password";
        return;
      }

      message.textContent = "✓ Password updated. Redirecting to your account…";
      message.className = "msg ok";
      setTimeout(() => { window.location.href = "account.html"; }, 1500);
    });
  </script>

  <script type="module" src="Navbar.js"></script>
</body>
</html>
