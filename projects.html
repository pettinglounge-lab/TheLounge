<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Projects — Petting Lounge</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <site-nav active="projects"></site-nav>

  <main class="projects-page">
    <h1>Your projects</h1>

    <!-- CREATE BOX -->
    <section class="panel create-box">
      <h2>Create a new portrait</h2>

      <div class="drop" id="drop" tabindex="0" role="button" aria-label="Upload a photo">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
          <path d="M12 16V4M12 4l-4 4M12 4l4 4" />
          <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" />
        </svg>
        <div><strong>Upload a photo</strong> or click to browse</div>
        <div id="fname" style="margin-top:6px;"></div>
      </div>
      <input type="file" id="file" accept="image/*" hidden />

      <p class="upload-tip">
        <strong>Tip:</strong> photos taken in bright, direct light work best — try to avoid strong shadows.
      </p>

      <textarea id="note" placeholder="Add any notes (optional) — e.g. 'sage green background, add the name Biscuit'"></textarea>

      <button class="btn btn-primary" id="create" disabled>Create project</button>
      <p class="msg" id="msg"></p>
    </section>

    <!-- SAVED PROJECTS (signed-in only) -->
    <section id="saved-section" style="display:none;">
      <h2>Saved</h2>
      <div id="projects" class="project-grid"></div>
    </section>
  </main>

  <script type="module">
    import { supabase } from "./supabaseClient.js";

    const { data: { session } } = await supabase.auth.getSession();
    // My Projects is the one account-only area — send guests to sign up.
    if (!session || session.user.is_anonymous === true) {
      window.location.href = "signup.html";
    }
    const isRealAccount = !!session && session.user.is_anonymous === false;

    const drop      = document.getElementById("drop");
    const fileIn    = document.getElementById("file");
    const fname     = document.getElementById("fname");
    const note      = document.getElementById("note");
    const createBtn = document.getElementById("create");
    const msg       = document.getElementById("msg");
    let selectedFile = null;

    // ---- pick / drop a file ----
    drop.addEventListener("click", () => fileIn.click());
    drop.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileIn.click(); } });
    ["dragover", "dragenter"].forEach(ev => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("drag"); }));
    ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("drag"); }));
    drop.addEventListener("drop", (e) => { e.preventDefault(); if (e.dataTransfer.files[0]) pick(e.dataTransfer.files[0]); });
    fileIn.addEventListener("change", (e) => { if (e.target.files[0]) pick(e.target.files[0]); });

    function pick(file) {
      if (!file.type.startsWith("image/")) { alert("Please choose an image file."); return; }
      if (!isRealAccount) { window.location.href = "signup.html"; return; }
      selectedFile = file;
      drop.classList.add("has-file");
      fname.textContent = "✓ " + file.name;
      createBtn.disabled = false;
    }

    // ---- create the project ----
    createBtn.addEventListener("click", async () => {
      if (!selectedFile) return;
      createBtn.disabled = true; createBtn.textContent = "Creating…";
      msg.textContent = ""; msg.className = "msg";
      try {
        const ext = selectedFile.name.split(".").pop();
        const photoPath = `${session.user.id}/${crypto.randomUUID()}.${ext}`;
        const up = await supabase.storage.from("pet-photos")
          .upload(photoPath, selectedFile, { contentType: selectedFile.type });
        if (up.error) throw up.error;

        const ins = await supabase.from("portraits").insert({
          user_id: session.user.id,
          photo_path: photoPath,
          config: { note: note.value.trim() || null },
          status: "draft",
        });
        if (ins.error) throw ins.error;

        selectedFile = null; fileIn.value = ""; note.value = "";
        drop.classList.remove("has-file"); fname.textContent = "";
        msg.textContent = "✓ Project created. Hit “Generate portrait” below to make the artwork.";
        msg.className = "msg ok";
        loadSaved();
      } catch (e) {
        msg.textContent = "Something went wrong: " + e.message;
        msg.className = "msg err";
      } finally {
        createBtn.textContent = "Create project";
      }
    });

    // ---- saved projects ----
    async function loadSaved() {
      const section = document.getElementById("saved-section");
      const box = document.getElementById("projects");
      section.style.display = "block";
      box.innerHTML = `<div class="empty">Loading…</div>`;

      const { data: rows, error } = await supabase
        .from("portraits")
        .select("id, photo_path, render_path, config, status, created_at")
        .order("created_at", { ascending: false });

      if (error || !rows || rows.length === 0) {
        box.innerHTML = `<div class="empty">No projects yet — upload a photo above to start.</div>`;
        return;
      }

      const cards = await Promise.all(rows.map(async (r) => {
        const rendered = r.status === "rendered" && r.render_path;

        // Show the rendered artwork if we have it, otherwise the uploaded photo.
        let imgUrl = "";
        if (rendered) {
          imgUrl = supabase.storage.from("portrait-renders").getPublicUrl(r.render_path).data.publicUrl;
        } else {
          const { data: signed } = await supabase.storage.from("pet-photos").createSignedUrl(r.photo_path, 3600);
          imgUrl = signed?.signedUrl || "";
        }

        const date = new Date(r.created_at).toLocaleDateString(undefined, { month: "short", day: "numeric" });
        const label = r.config?.note ? escapeHtml(r.config.note) : "Untitled";

        let action;
        if (rendered) {
          action = `<button class="btn btn-outline btn-sm generate" data-id="${r.id}">Regenerate</button>`;
        } else if (r.status === "rendering") {
          action = `<span class="badge">rendering…</span>`;
        } else {
          action = `<button class="btn btn-primary btn-sm generate" data-id="${r.id}">Generate portrait</button>`;
        }

        return `
          <div class="project-card">
            <img src="${imgUrl}" alt="Project image" />
            <div class="body">
              <div class="note">${label}</div>
              <div class="meta"><span>${r.status}</span><span>${date}</span></div>
              <div style="margin-top:10px;">${action}</div>
            </div>
          </div>`;
      }));
      box.innerHTML = cards.join("");

      // wire the generate buttons
      box.querySelectorAll(".generate").forEach((btn) => {
        btn.addEventListener("click", () => generate(btn));
      });
    }

    // ---- call the edge function to render ----
    async function generate(btn) {
      const portraitId = btn.dataset.id;
      btn.disabled = true;
      btn.textContent = "Rendering… (~15s)";
      try {
        const { data, error } = await supabase.functions.invoke("render-portrait", {
          body: { portraitId },
        });
        if (error) throw error;
        loadSaved(); // refresh to show the finished artwork
      } catch (e) {
        alert("Render failed: " + (e.message || e));
        loadSaved();
      }
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    }

    if (isRealAccount) loadSaved();
  </script>

  <script type="module" src="Navbar.js"></script>
</body>
</html>
